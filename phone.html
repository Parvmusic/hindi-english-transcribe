<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribe · Hindi + English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f0; --panel: #ffffff; --ink: #16211f; --muted: #5d6b68;
    --line: #d3dbd8; --accent: #1b5e52; --accent-ink: #ffffff; --wash: #e3ebe8; --err: #a3261f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716; --panel: #172120; --ink: #e6efec; --muted: #93a39f;
      --line: #2a3936; --accent: #5cc4ae; --accent-ink: #08201b; --wash: #1f2c2a; --err: #ff8a80;
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hind", "Noto Sans Devanagari", system-ui, sans-serif;
    font-size: 17px; line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 18px 80px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  details.key { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
  details.key summary { cursor: pointer; font-weight: 500; }
  details.key p { color: var(--muted); font-size: 15px; margin: 10px 0; }
  details.key a { color: var(--accent); }
  input[type=password], select {
    font: inherit; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 10px; width: 100%;
  }

  .drop {
    display: block; border: 2px dashed var(--line); background: var(--panel);
    border-radius: 10px; padding: 28px 18px; text-align: center; cursor: pointer;
  }
  .drop:hover, .drop:focus-within { border-color: var(--accent); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { display: block; font-weight: 600; word-break: break-all; }
  .drop span { color: var(--muted); font-size: 15px; }

  .opts { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 16px 0; }
  @media (min-width: 560px) { .opts { grid-template-columns: 1fr 1fr 1fr; } }
  .opts label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); gap: 4px; }
  .opts select { background: var(--panel); }

  button {
    font: inherit; font-size: 16px; font-weight: 500; border-radius: 6px;
    padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .status { min-height: 26px; color: var(--muted); font-size: 15px; margin: 10px 0 14px; }
  .status.err { color: var(--err); }

  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .toolbar .grow { flex: 1; }
  .toolbar label { font-size: 15px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #out { padding: 16px 18px; min-height: 120px; }
  #out p { margin: 0 0 10px; }
  #out .t { display: none; color: var(--muted); font-size: 13px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  #out.stamps .t { display: inline; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Transcribe</h1>
  <p class="sub">Upload audio. Get text in Hindi and English, mixed the way it was spoken.</p>

  <details class="key" id="keybox">
    <summary id="keysum">Add your Groq key</summary>
    <p>A free Groq key does the transcribing. Get one at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>, then paste it here. It is saved only in this browser on this device.</p>
    <input type="password" id="key" placeholder="gsk_..." autocomplete="off" autocapitalize="off" spellcheck="false">
  </details>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="audio/*,video/mp4,video/webm,.m4a,.mp3,.wav,.ogg,.opus,.flac,.mp4,.webm">
    <strong id="fname">Choose an audio file</strong>
    <span>mp3, m4a, wav, ogg, mp4, webm, flac · long files are split automatically</span>
  </label>

  <div class="opts">
    <label>Language
      <select id="mode">
        <option value="mixed">Hindi + English mixed</option>
        <option value="hindi">Hindi only</option>
        <option value="english">English only</option>
        <option value="auto">Auto-detect</option>
      </select>
    </label>
    <label>Hindi words written in
      <select id="script">
        <option value="devanagari">देवनागरी (Devanagari)</option>
        <option value="roman">Roman letters (Hinglish)</option>
      </select>
    </label>
    <label>Quality
      <select id="model">
        <option value="whisper-large-v3">Best accuracy</option>
        <option value="whisper-large-v3-turbo">Faster</option>
      </select>
    </label>
  </div>

  <button class="primary" id="go" disabled>Transcribe</button>
  <button class="primary" id="cont" hidden style="margin-top:10px"></button>
  <div class="status" id="status" role="status"></div>

  <section class="result">
    <div class="toolbar">
      <label><input type="checkbox" id="stamps"> Show timestamps</label>
      <span class="grow"></span>
      <button id="copy" disabled>Copy text</button>
      <button id="save" disabled>Download .txt</button>
    </div>
    <div id="out"><p class="empty">Your transcript will appear here.</p></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const DIRECT_MAX = 24 * 1024 * 1024;
const API_URL = "https://api.groq.com/openai/v1/audio/transcriptions";
const PROMPT_DEVANAGARI = "आज हम project के बारे में बात करेंगे, and then next steps decide करेंगे. Okay, let's start the meeting.";
const PROMPT_ROMAN = "Aaj hum project ke baare mein baat karenge, and then next steps decide karenge. Okay, let's start the meeting.";
let segs = [];

const store = {
  get() { try { return localStorage.getItem("groq_key") || ""; } catch (e) { return ""; } },
  set(v) { try { localStorage.setItem("groq_key", v); } catch (e) {} }
};

const fmt = s => { s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const plain = () => segs.map(s => s.text).join("\n");

function setStatus(text, isErr) {
  $("status").textContent = text;
  $("status").className = "status" + (isErr ? " err" : "");
}
function refreshKeyLabel() {
  const has = $("key").value.trim().length > 0;
  $("keysum").textContent = has ? "Groq key saved on this device" : "Add your Groq key";
  $("keybox").open = !has;
  updateGo();
}
function updateGo() {
  $("go").disabled = !($("file").files[0] && $("key").value.trim());
}

$("key").value = store.get();
$("key").addEventListener("input", () => { store.set($("key").value.trim()); refreshKeyLabel(); });
refreshKeyLabel();

$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  $("fname").textContent = f.name;
  $("cont").hidden = true; job = null;
  setStatus(f.size > DIRECT_MAX ? "Big file (" + (f.size / 1048576).toFixed(0) + " MB). It will be split into parts and transcribed one by one." : "");
  updateGo();
});
$("stamps").addEventListener("change", e => $("out").classList.toggle("stamps", e.target.checked));

function render() {
  const out = $("out");
  out.innerHTML = "";
  segs.forEach(s => {
    const p = document.createElement("p");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = fmt(s.start || 0);
    p.append(t, document.createTextNode(s.text));
    out.appendChild(p);
  });
}

function toWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
    o += 2;
  }
  return new Blob([buf], { type: "audio/wav" });
}

// Decode a big file, mix to mono at 16 kHz, and cut it into parts under 25 MB,
// cutting at the quietest moment near each boundary so words are not split.
async function decodeSplit(file) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC({ sampleRate: 16000 });
  let audio;
  try {
    audio = await ctx.decodeAudioData(await file.arrayBuffer());
  } catch (e) {
    throw new Error("This phone could not open the big file. Try a shorter file, or use the Mac version.");
  }
  const rate = audio.sampleRate;
  const n = audio.length;
  const mono = new Float32Array(n);
  for (let c = 0; c < audio.numberOfChannels; c++) {
    const ch = audio.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += ch[i] / audio.numberOfChannels;
  }
  ctx.close();

  const chunkSec = Math.min(600, Math.floor(22e6 / (rate * 2)));
  const chunkLen = chunkSec * rate;
  const frame = Math.floor(rate * 0.1);
  const parts = [];
  let start = 0;
  while (start < n) {
    let end = Math.min(n, start + chunkLen);
    if (end < n) {
      let best = end, bestE = Infinity;
      for (let f = end - 10 * rate; f + frame <= end; f += frame) {
        let e = 0;
        for (let i = f; i < f + frame; i++) e += mono[i] * mono[i];
        if (e < bestE) { bestE = e; best = f; }
      }
      end = best;
    }
    parts.push({ blob: toWav(mono.subarray(start, end), rate), offset: start / rate });
    start = end;
  }
  return parts;
}

// ==BIG-START==
// Very large files are cut into parts by slicing bytes (no decoding), so a 1 GB
// file never has to fit in memory. This works for WAV and MP3.
function readWavInfo(buf) {
  const v = new DataView(buf);
  if (buf.byteLength < 12 || v.getUint32(0) !== 0x52494646 || v.getUint32(8) !== 0x57415645) return null;
  let p = 12, fmt = null, dataStart = -1, dataLen = 0;
  while (p + 8 <= buf.byteLength) {
    const id = v.getUint32(p), size = v.getUint32(p + 4, true);
    if (id === 0x666d7420) fmt = new Uint8Array(buf.slice(p + 8, p + 8 + size));
    else if (id === 0x64617461) { dataStart = p + 8; dataLen = size; break; }
    p += 8 + size + (size & 1);
  }
  if (!fmt || fmt.length < 16 || dataStart < 0) return null;
  const fv = new DataView(fmt.buffer, fmt.byteOffset, fmt.length);
  return { fmt, dataStart, dataLen, byteRate: fv.getUint32(8, true), blockAlign: fv.getUint16(12, true) };
}

function wavHeader(fmt, dataLen) {
  const h = new ArrayBuffer(12 + 8 + fmt.length + 8);
  const v = new DataView(h);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 4 + 8 + fmt.length + 8 + dataLen, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, fmt.length, true);
  new Uint8Array(h, 20, fmt.length).set(fmt);
  w(20 + fmt.length, "data"); v.setUint32(24 + fmt.length, dataLen, true);
  return h;
}

async function splitWav(file) {
  const info = readWavInfo(await file.slice(0, 1024 * 1024).arrayBuffer());
  if (!info || !info.blockAlign || !info.byteRate) return null;
  const avail = file.size - info.dataStart;
  const dataLen = (!info.dataLen || info.dataLen > avail) ? avail : info.dataLen;
  const partBytes = Math.floor(22e6 / info.blockAlign) * info.blockAlign;
  const parts = [];
  for (let a = 0; a < dataLen; a += partBytes) {
    const len = Math.min(partBytes, dataLen - a);
    const pcm = file.slice(info.dataStart + a, info.dataStart + a + len);
    parts.push({ blob: new Blob([wavHeader(info.fmt, len), pcm], { type: "audio/wav" }), offset: a / info.byteRate, name: "part.wav" });
  }
  return parts;
}

function audioDuration(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const a = new Audio();
    const done = d => { URL.revokeObjectURL(url); resolve(isFinite(d) && d > 0 ? d : 0); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(0);
    setTimeout(() => done(0), 8000);
    a.src = url;
  });
}

async function splitMp3(file) {
  const PART = 20 * 1024 * 1024;
  const dur = await audioDuration(file);
  const bytesPerSec = dur ? file.size / dur : 16000; // fallback: assume 128 kbps
  const parts = [];
  for (let a = 0; a < file.size; a += PART) {
    parts.push({ blob: file.slice(a, Math.min(file.size, a + PART), "audio/mpeg"), offset: a / bytesPerSec, name: "part.mp3" });
  }
  return parts;
}

async function makeParts(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".wav")) { const parts = await splitWav(file); if (parts) return parts; }
  if (/\.(mp3|mpeg|mpga)$/.test(name)) return await splitMp3(file);
  if (file.size > 400 * 1024 * 1024) {
    throw new Error("This file type is too big to split on a phone. Convert it to mp3 first, or use the Mac version.");
  }
  return await decodeSplit(file);
}
// ==BIG-END==

async function callGroq(blob, filename, key) {
  const mode = $("mode").value;
  const fd = new FormData();
  fd.append("file", blob, filename);
  fd.append("model", $("model").value);
  fd.append("response_format", "verbose_json");
  fd.append("temperature", "0");
  if (mode === "english") fd.append("language", "en");
  if (mode === "hindi" || mode === "mixed") fd.append("language", "hi");
  if (mode === "mixed") fd.append("prompt", $("script").value === "roman" ? PROMPT_ROMAN : PROMPT_DEVANAGARI);

  const res = await fetch(API_URL, { method: "POST", headers: { "Authorization": "Bearer " + key }, body: fd });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let msg = data.error && data.error.message ? data.error.message : ("Error " + res.status);
    if (res.status === 401) msg = "The Groq key was not accepted. Check that you pasted it fully.";
    if (res.status === 429) msg = "Groq's free limit was reached. Wait a while and try again.";
    throw new Error(msg);
  }
  return data;
}

function toSegs(data, offset) {
  if (data.segments && data.segments.length) {
    return data.segments.map(s => ({ start: (s.start || 0) + offset, text: (s.text || "").trim() })).filter(s => s.text);
  }
  return data.text && data.text.trim() ? [{ start: offset, text: data.text.trim() }] : [];
}

let job = null; // { file, parts, next } for big files, so a stopped run can continue

async function runParts(key) {
  for (let i = job.next; i < job.parts.length; i++) {
    setStatus("Transcribing part " + (i + 1) + " of " + job.parts.length + "…");
    try {
      const p = job.parts[i];
      const data = await callGroq(p.blob, p.name || "part.wav", key);
      segs = segs.concat(toSegs(data, p.offset));
      if (segs.length) render();
      job.next = i + 1;
    } catch (e) {
      job.next = i;
      throw e;
    }
  }
}

async function transcribe(resume) {
  const f = $("file").files[0];
  const key = $("key").value.trim();
  if (!f || !key) return;

  $("go").disabled = true; $("cont").hidden = true;
  $("copy").disabled = true; $("save").disabled = true;
  let failed = false;
  try {
    if (!resume) {
      segs = []; job = null;
      $("out").innerHTML = '<p class="empty">Working…</p>';
      if (f.size <= DIRECT_MAX) {
        setStatus("Uploading and transcribing. This usually takes a few seconds…");
        segs = toSegs(await callGroq(f, f.name, key), 0);
      } else {
        setStatus("Big file. Preparing it in parts…");
        job = { file: f, parts: await makeParts(f), next: 0 };
      }
    }
    if (job) await runParts(key);
    if (segs.length) { render(); setStatus("Done."); }
    else { $("out").innerHTML = '<p class="empty">No speech found in this file.</p>'; setStatus(""); }
  } catch (e) {
    failed = true;
    if (!segs.length) $("out").innerHTML = '<p class="empty">Your transcript will appear here.</p>';
    setStatus((segs.length ? "Stopped early. The parts done so far are shown. " : "Could not transcribe: ") + e.message, true);
  }
  updateGo();
  const has = segs.length > 0;
  $("copy").disabled = !has; $("save").disabled = !has;
  if (failed && job && job.next < job.parts.length && job.file === f) {
    $("cont").textContent = "Continue from part " + (job.next + 1) + " of " + job.parts.length;
    $("cont").hidden = false;
  }
}

$("go").addEventListener("click", () => transcribe(false));
$("cont").addEventListener("click", () => transcribe(true));

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(plain()); setStatus("Copied."); }
  catch (e) { setStatus("Copy was blocked. Select the text and copy it by hand.", true); }
});
$("save").addEventListener("click", () => {
  const name = ($("file").files[0]?.name || "transcript").replace(/\.[^.]+$/, "") + ".txt";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([plain()], { type: "text/plain;charset=utf-8" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
</script>
</body>
</html>
